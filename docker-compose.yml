version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartcode_analyzer
      POSTGRES_USER: smartcode_user
      POSTGRES_PASSWORD: smartcode_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcode_user -d smartcode_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcode-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartcode_analyzer
      SPRING_DATASOURCE_USERNAME: smartcode_user
      SPRING_DATASOURCE_PASSWORD: smartcode_secure_pass_2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcode-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
